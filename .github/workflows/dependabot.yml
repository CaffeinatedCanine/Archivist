version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for all dev tooling bumps.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      # One PR for routine runtime bumps. ao3.js is excluded so a scraper
      # change gets its own PR and is easy to test/revert on its own.
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns:
          - "@fujocoded/ao3.js"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday